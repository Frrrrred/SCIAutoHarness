name: Bug report
description: Report a reproducible, non-sensitive problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        For sensitive vulnerabilities, read SECURITY.md first. Do not paste credentials,
        personal AGENTS/configuration, chat transcripts or unredacted task logs.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the task state and entry point.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide bounded steps using synthetic files where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, filesystem, Python/pwsh if relevant, and commit.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include actual errors and test selection/counts; omit private paths and secrets.
