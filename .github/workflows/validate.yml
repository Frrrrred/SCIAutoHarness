name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Inspect environment and skill
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node probe failed' }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python probe failed' }
          Get-Command pwsh -ErrorAction Stop | Select-Object Name, Source
          npm run check:skill
          if ($LASTEXITCODE -ne 0) { throw 'Skill validation failed' }
          npm run help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
          npm run help:submit
          if ($LASTEXITCODE -ne 0) { throw 'Submit help failed' }
      - name: Check all module syntax
        run: |
          $modules = @(Get-ChildItem -LiteralPath 'skills' -Recurse -File -Filter '*.mjs')
          if ($modules.Count -ne 16) { throw 'Unexpected module inventory' }
          foreach ($module in $modules) {
            node --check $module.FullName
            if ($LASTEXITCODE -ne 0) { throw ('Syntax failure: ' + $module.FullName) }
          }
      - name: Verify synthetic record and invocation contracts
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP ('sciautoharness-python-' + [guid]::NewGuid())
          if (Test-Path -LiteralPath $pythonRoot) { throw 'Refusing to reuse Python fixture root' }
          New-Item -ItemType Directory -Path $pythonRoot -ErrorAction Stop | Out-Null
          $env:EVIDENCE_TEST_ROOT = $pythonRoot
          $program = @'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('examples/ambition-evaluation/tests', pattern='test_*.py')
          if suite.countTestCases() != 45:
              raise RuntimeError('Unexpected Python case inventory')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 45 or result.skipped:
              raise RuntimeError('Incomplete Python verification')
          sys.exit(0 if result.wasSuccessful() else 1)
          '@
          $program | python -
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Python verification failed' }
      - name: Run and verify all 661 current regression cases
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP ('sciautoharness-tests-' + [guid]::NewGuid())
          if (Test-Path -LiteralPath $workRoot) { throw 'Refusing to reuse test root' }
          npm test -- --work-root $workRoot
          $regressionExit = $LASTEXITCODE
          $fixtureRoots = @(Get-ChildItem -LiteralPath $workRoot -Directory -Filter 'fixtures-*')
          if ($fixtureRoots.Count -ne 1) { throw 'Unexpected fixture root count' }
          $resultFile = Join-Path $fixtureRoots[0].FullName 'regression-results.json'
          $report = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          $results = @($report.results)
          $preparationRetries = @()
          if ($null -ne $report.fixturePreparationRetries) { $preparationRetries = @($report.fixturePreparationRetries) }
          Write-Output ('Main regression: tests=' + $report.tests + '; passed=' + $report.passed + '; failed=' + $report.failed + '; skipped=' + $report.skipped)
          Write-Output ('Fixture preparation retries: ' + $preparationRetries.Count)
          if ($preparationRetries.Count -gt 0) { $preparationRetries | ConvertTo-Json -Depth 20 -Compress | Write-Output }
          if ($regressionExit -ne 0) {
            $results | Where-Object { $_.pass -cne $true } | Select-Object id, error, skipped, skipReason | ConvertTo-Json -Depth 8 -Compress | Write-Output
            throw ('Main regression process failed: ' + $regressionExit)
          }
          if ($report.suite -ne 'sciautoharness-regression' -or $report.syntheticOnly -cne $true -or $report.selection -ne 'all' -or $report.selectionError) {
            throw 'Wrong suite or filtered/invalid selection'
          }
          if ($report.tests -ne ($report.passed + $report.failed + $report.skipped)) { throw 'Contradictory result counts' }
          if ($report.tests -ne 661 -or $report.passed -ne 661 -or $report.failed -ne 0 -or $report.skipped -ne 0 -or $results.Count -ne 661) {
            throw 'Incomplete or failed current regression'
          }
          if (@($results | Where-Object { $_.pass -cne $true -or $_.skipped -ceq $true -or $_.id -isnot [string] -or [string]::IsNullOrWhiteSpace($_.id) }).Count -ne 0) {
            throw 'Invalid individual result'
          }
          if (@($results.id | Sort-Object -Unique).Count -ne 661) { throw 'Duplicate case IDs' }
          $idsJson = ConvertTo-Json -InputObject @($results.id) -Compress
          $rosterHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($idsJson))).ToLowerInvariant()
          if ($rosterHash -ne '0506de6faf6dc276df47145100dc6407aaf4d6daed193cdd576d8f015bb9108b') { throw 'Unexpected ordered case roster' }
          Write-Output ('Ordered case roster SHA-256: ' + $rosterHash)
          Write-Output ('Current regression: 661/661; Node ' + $report.node + '; platform ' + $report.platform)
