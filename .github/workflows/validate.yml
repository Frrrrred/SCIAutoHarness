name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Inspect environment and skill
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node probe failed' }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python probe failed' }
          Get-Command pwsh -ErrorAction Stop | Select-Object Name, Source
          npm run check:skill
          if ($LASTEXITCODE -ne 0) { throw 'Skill validation failed' }
          npm run help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
          npm run help:submit
          if ($LASTEXITCODE -ne 0) { throw 'Submit help failed' }
      - name: Check all module syntax
        run: |
          $modules = @(Get-ChildItem -LiteralPath 'skills/codex-task-harness/scripts' -Recurse -File -Filter '*.mjs')
          if ($modules.Count -ne 14) { throw 'Unexpected module inventory' }
          foreach ($module in $modules) {
            node --check $module.FullName
            if ($LASTEXITCODE -ne 0) { throw ('Syntax failure: ' + $module.FullName) }
          }
      - name: Run and verify all 399 main regression cases
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP ('codex-task-harness-tests-' + [guid]::NewGuid())
          if (Test-Path -LiteralPath $workRoot) { throw 'Refusing to reuse test root' }
          npm test -- --work-root $workRoot
          if ($LASTEXITCODE -ne 0) { throw 'Main regression process failed' }
          $fixtureRoots = @(Get-ChildItem -LiteralPath $workRoot -Directory -Filter 'fixtures-*')
          if ($fixtureRoots.Count -ne 1) { throw 'Unexpected fixture root count' }
          $resultFile = Join-Path $fixtureRoots[0].FullName 'regression-results.json'
          $report = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          $results = @($report.results)
          if ($report.suite -ne 'codex-task-harness-regression' -or $report.selection -ne 'all') {
            throw 'Wrong suite or filtered selection'
          }
          if ($report.tests -ne 399 -or $report.passed -ne 399 -or $report.failed -ne 0 -or $results.Count -ne 399) {
            throw 'Incomplete or failed main regression'
          }
          if (@($results | Where-Object { $_.pass -cne $true -or [string]::IsNullOrWhiteSpace($_.id) }).Count -ne 0) {
            throw 'Invalid individual result'
          }
          if (@($results.id | Sort-Object -Unique).Count -ne 399) { throw 'Duplicate case IDs' }
          Write-Output ('Main regression: 399/399; Node ' + $report.node + '; platform ' + $report.platform)
          Write-Output ('Fixture preparation retries: ' + @($report.fixturePreparationRetries).Count)
          Write-Output '84 cross-runtime upgrade cases were NOT RUN: the matching external frozen baseline is unavailable.'
